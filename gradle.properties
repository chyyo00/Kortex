group=com.choverse
# The version lives in version.properties, which every build raises automatically (README, "버전").

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official

# Keeps the heavyweight Minecraft-toolchain modules (Fabric Loom / ForgeGradle) from being configured
# when you only ask for a lightweight module, e.g. `./gradlew :kordex-core:test`.
org.gradle.configureondemand=true

# ForgeGradle 7 (per the official Forge MDK).
net.minecraftforge.gradle.merge-source-sets=true

kordex.pom.url=https://github.com/chyyo00/Kortex
kordex.pom.license.name=MIT License
kordex.pom.license.url=https://github.com/chyyo00/Kortex/blob/main/LICENSE
kordex.pom.developer.name=chyyo00
kordex.pom.developer.email=bravegirl0904@gmail.com
kordex.pom.scm.url=https://github.com/chyyo00/Kortex

# ---- Maven Central (README, "Maven Central 배포") ------------------------------------------------------
# Central rejects a POM without this metadata, so `./gradlew centralBundle` stops and lists whatever is
# still missing. Add the lines below to this file (they are public, in every published POM):
#
#   kordex.pom.url=https://github.com/<owner>/<repo>
#   kordex.pom.license.name=<license name>
#   kordex.pom.license.url=<license text URL>
#   kordex.pom.developer.name=<public name>
#   kordex.pom.developer.email=<public email>
#   kordex.pom.developer.organization=<optional>
#   kordex.pom.developer.organizationUrl=<optional>
#   kordex.pom.scm.url=https://github.com/<owner>/<repo>
#
# (scm connection/developerConnection are derived from kordex.pom.scm.url; override them with
# kordex.pom.scm.connection / kordex.pom.scm.developerConnection if your host needs different URLs.)
#
# Signing keys and Central tokens do NOT belong in this file - see the README.
